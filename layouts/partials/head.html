<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="{{ if .Description }}{{ .Description }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<meta name="author" content="{{ .Site.Params.author }}">
<meta property="og:title" content="{{ if .Title }}{{ .Title }} | {{ end }}{{ .Site.Title }}">
<meta property="og:description" content="{{ if .Description }}{{ .Description }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
<title>{{ if .Title }}{{ .Title }} — {{ end }}{{ .Site.Title }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ===== DESIGN SYSTEM ===== */
  :root {
    --navy:    #1E3A5F;
    --navy-deep: #0F2440;
    --orange:  #F97316;
    --orange-soft: #FB923C;
    --gray:    #6B7280;
    --gray-light: #9CA3AF;
    --gray-muted: #E5E7EB;
    --bg:      #F8FAFC;
    --bg-card: #FFFFFF;
    --ink:     #0F172A;
    --ink-soft: #334155;
    --line:    rgba(30, 58, 95, 0.12);
    --line-strong: rgba(30, 58, 95, 0.25);

    --font-display: 'DM Serif Display', Georgia, serif;
    --font-body:    'Crimson Pro', Georgia, serif;
    --font-mono:    'JetBrains Mono', monospace;

    --radius: 2px;
    --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { font-size: 18px; scroll-behavior: smooth; }

  body {
    font-family: var(--font-body);
    font-weight: 300;
    color: var(--ink);
    background: var(--bg);
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== GRID BACKGROUND TEXTURE ===== */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(30,58,95,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(30,58,95,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* ===== TYPOGRAPHY ===== */
  h1, h2, h3, h4, h5, h6 {
    font-family: var(--font-display);
    font-weight: 400;
    line-height: 1.2;
    color: var(--navy);
  }

  a { color: inherit; text-decoration: none; }

  img { max-width: 100%; display: block; }

  /* ===== LAYOUT ===== */
  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 2rem;
  }

  .container--narrow {
    max-width: 780px;
    margin: 0 auto;
    padding: 0 2rem;
  }

  main { position: relative; z-index: 1; }

  /* ===== NAVIGATION ===== */
  .nav {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(248, 250, 252, 0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }

  .nav__inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 2rem;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .nav__logo {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    text-decoration: none;
  }

  .nav__logo-mark {
    width: 32px;
    height: 32px;
    background: var(--navy);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .nav__logo-mark::before {
    content: '';
    position: absolute;
    bottom: -4px;
    right: -4px;
    width: 12px;
    height: 12px;
    background: var(--orange);
  }

  .nav__logo-mark svg {
    width: 18px;
    height: 18px;
    fill: white;
  }

  .nav__logo-text {
    font-family: var(--font-display);
    font-size: 1.25rem;
    color: var(--navy);
    letter-spacing: 0.02em;
  }

  .nav__links {
    display: flex;
    align-items: center;
    gap: 0.25rem;
    list-style: none;
  }

  .nav__links a {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gray);
    padding: 0.5rem 1rem;
    transition: color var(--transition);
    position: relative;
  }

  .nav__links a::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 1rem;
    right: 1rem;
    height: 2px;
    background: var(--orange);
    transform: scaleX(0);
    transition: transform var(--transition);
  }

  .nav__links a:hover { color: var(--navy); }
  .nav__links a:hover::after { transform: scaleX(1); }

  /* ===== HERO ===== */
  .hero {
    background: var(--navy-deep);
    color: white;
    padding: 7rem 0 5rem;
    position: relative;
    overflow: hidden;
  }

  .hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(249,115,22,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(249,115,22,0.06) 1px, transparent 1px),
      linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 80px 80px, 80px 80px, 20px 20px, 20px 20px;
  }

  .hero::after {
    content: '';
    position: absolute;
    top: -60px;
    right: -60px;
    width: 300px;
    height: 300px;
    border: 60px solid rgba(249, 115, 22, 0.08);
    transform: rotate(15deg);
  }

  .hero__inner {
    position: relative;
    z-index: 1;
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 2rem;
  }

  .hero__label {
    font-family: var(--font-mono);
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--orange);
    margin-bottom: 1.5rem;
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .hero__label::before {
    content: '';
    display: inline-block;
    width: 32px;
    height: 1px;
    background: var(--orange);
  }

  .hero__title {
    font-family: var(--font-display);
    font-size: clamp(3rem, 7vw, 5.5rem);
    color: white;
    line-height: 1.05;
    margin-bottom: 1.5rem;
    max-width: 750px;
  }

  .hero__title em {
    color: var(--orange);
    font-style: italic;
  }

  .hero__tagline {
    font-family: var(--font-body);
    font-weight: 300;
    font-size: 1.25rem;
    color: rgba(255,255,255,0.6);
    max-width: 500px;
    line-height: 1.6;
  }

  /* ===== SECTION LABELS ===== */
  .section-label {
    font-family: var(--font-mono);
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--orange);
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: 2.5rem;
  }

  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--line-strong);
    max-width: 120px;
  }

  /* ===== ARTICLES GRID ===== */
  .articles-section {
    padding: 5rem 0;
  }

  .articles-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 1.5px;
    background: var(--line);
    border: 1.5px solid var(--line);
  }

  .card {
    background: var(--bg-card);
    padding: 2rem;
    position: relative;
    transition: background var(--transition);
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .card:hover { background: #FDFEFF; }

  .card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 3px;
    height: 0;
    background: var(--orange);
    transition: height 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .card:hover::before { height: 100%; }

  .card__category {
    font-family: var(--font-mono);
    font-size: 0.6rem;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--orange);
  }

  .card__title {
    font-family: var(--font-display);
    font-size: 1.4rem;
    color: var(--navy);
    line-height: 1.25;
    flex: 1;
  }

  .card__title a { transition: color var(--transition); }
  .card__title a:hover { color: var(--orange); }

  .card__excerpt {
    font-size: 0.95rem;
    color: var(--gray);
    line-height: 1.65;
    font-weight: 300;
  }

  .card__meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 1rem;
    border-top: 1px solid var(--line);
    margin-top: auto;
  }

  .card__date {
    font-family: var(--font-mono);
    font-size: 0.65rem;
    color: var(--gray-light);
    letter-spacing: 0.05em;
  }

  .card__link {
    font-family: var(--font-mono);
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--navy);
    display: flex;
    align-items: center;
    gap: 0.4rem;
    transition: color var(--transition), gap var(--transition);
  }

  .card__link:hover { color: var(--orange); gap: 0.75rem; }

  /* ===== LIST PAGE ===== */
  .list-page {
    padding: 4rem 0 6rem;
  }

  .list-header {
    padding: 5rem 0 3rem;
    border-bottom: 1.5px solid var(--line-strong);
    margin-bottom: 3rem;
  }

  .list-header h1 {
    font-size: clamp(2.5rem, 5vw, 4rem);
  }

  .posts-list {
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  .post-row {
    display: grid;
    grid-template-columns: 120px 1fr auto;
    gap: 2rem;
    align-items: start;
    padding: 2rem 0;
    border-bottom: 1px solid var(--line);
    transition: padding var(--transition);
    position: relative;
  }

  .post-row::before {
    content: '';
    position: absolute;
    left: -2rem;
    top: 0;
    bottom: 0;
    width: 3px;
    background: var(--orange);
    transform: scaleY(0);
    transition: transform 0.3s ease;
    transform-origin: top;
  }

  .post-row:hover::before { transform: scaleY(1); }

  .post-row__date {
    font-family: var(--font-mono);
    font-size: 0.65rem;
    color: var(--gray-light);
    padding-top: 0.35rem;
    letter-spacing: 0.05em;
  }

  .post-row__content h2 {
    font-size: 1.35rem;
    margin-bottom: 0.4rem;
  }

  .post-row__content h2 a:hover { color: var(--orange); }

  .post-row__excerpt {
    font-size: 0.9rem;
    color: var(--gray);
    margin-top: 0.4rem;
    font-weight: 300;
  }

  .post-row__category {
    font-family: var(--font-mono);
    font-size: 0.6rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--orange);
    white-space: nowrap;
    padding-top: 0.35rem;
  }

  /* ===== SINGLE ARTICLE ===== */
  .article-header {
    padding: 5rem 0 4rem;
    border-bottom: 1.5px solid var(--line-strong);
    margin-bottom: 4rem;
  }

  .article-category {
    font-family: var(--font-mono);
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--orange);
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 1.5rem;
  }

  .article-category::before {
    content: '';
    width: 24px;
    height: 1px;
    background: var(--orange);
  }

  .article-title {
    font-size: clamp(2rem, 5vw, 3.5rem);
    line-height: 1.1;
    margin-bottom: 1.5rem;
    max-width: 700px;
  }

  .article-meta {
    display: flex;
    align-items: center;
    gap: 2rem;
    font-family: var(--font-mono);
    font-size: 0.65rem;
    color: var(--gray-light);
    letter-spacing: 0.05em;
  }

  .article-meta span {
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }

  /* ===== ARTICLE CONTENT ===== */
  .article-body {
    font-size: 1.15rem;
    line-height: 1.85;
    color: var(--ink-soft);
    padding-bottom: 6rem;
  }

  .article-body h2 {
    font-size: 1.9rem;
    margin: 3rem 0 1rem;
    padding-top: 1rem;
    border-top: 1.5px solid var(--line-strong);
  }

  .article-body h3 {
    font-size: 1.4rem;
    margin: 2rem 0 0.75rem;
    color: var(--ink);
  }

  .article-body p { margin-bottom: 1.5rem; }

  .article-body ul, .article-body ol {
    padding-left: 1.5rem;
    margin-bottom: 1.5rem;
  }

  .article-body li { margin-bottom: 0.5rem; }

  .article-body blockquote {
    border-left: 3px solid var(--orange);
    padding: 1rem 1.5rem;
    margin: 2rem 0;
    background: rgba(249,115,22,0.04);
    font-style: italic;
    font-size: 1.2rem;
    color: var(--navy);
  }

  .article-body code {
    font-family: var(--font-mono);
    font-size: 0.85em;
    background: var(--gray-muted);
    padding: 0.1em 0.4em;
    border-radius: 2px;
  }

  .article-body pre {
    background: var(--navy-deep);
    color: #e2e8f0;
    padding: 1.5rem;
    overflow-x: auto;
    margin: 2rem 0;
    font-family: var(--font-mono);
    font-size: 0.85rem;
  }

  .article-body pre code { background: none; padding: 0; }

  .article-body strong { font-weight: 600; color: var(--ink); }

  .article-body a { color: var(--navy); border-bottom: 1px solid var(--orange); transition: color var(--transition); }
  .article-body a:hover { color: var(--orange); }

  /* ===== TAGS ===== */
  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-top: 2rem;
    padding-top: 2rem;
    border-top: 1px solid var(--line);
  }

  .tag {
    font-family: var(--font-mono);
    font-size: 0.6rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 0.3rem 0.75rem;
    border: 1px solid var(--line-strong);
    color: var(--gray);
    transition: all var(--transition);
  }

  .tag:hover {
    border-color: var(--orange);
    color: var(--orange);
  }

  /* ===== FOOTER ===== */
  .footer {
    background: var(--navy-deep);
    color: rgba(255,255,255,0.5);
    padding: 3rem 0;
    margin-top: 4rem;
    position: relative;
    z-index: 1;
  }

  .footer__inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 1rem;
  }

  .footer__logo {
    font-family: var(--font-display);
    font-size: 1.1rem;
    color: white;
  }

  .footer__text {
    font-family: var(--font-mono);
    font-size: 0.65rem;
    letter-spacing: 0.08em;
  }

  .footer__admin a {
    font-family: var(--font-mono);
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(249,115,22,0.6);
    transition: color var(--transition);
  }

  .footer__admin a:hover { color: var(--orange); }

  /* ===== ABOUT PAGE ===== */
  .about-page {
    padding: 5rem 0 6rem;
  }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 768px) {
    html { font-size: 16px; }

    .nav__links {
      display: none;
    }

    .hero { padding: 4rem 0 3rem; }

    .articles-grid {
      grid-template-columns: 1fr;
    }

    .post-row {
      grid-template-columns: 1fr;
      gap: 0.5rem;
    }

    .post-row__date { order: -1; }
    .post-row__category { display: none; }

    .footer__inner { flex-direction: column; text-align: center; }
  }

  /* ===== ANIMATIONS ===== */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .hero__label  { animation: fadeUp 0.6s ease both; }
  .hero__title  { animation: fadeUp 0.6s 0.1s ease both; }
  .hero__tagline{ animation: fadeUp 0.6s 0.2s ease both; }
  .card         { animation: fadeUp 0.5s ease both; }
  .card:nth-child(2) { animation-delay: 0.05s; }
  .card:nth-child(3) { animation-delay: 0.1s; }
  .card:nth-child(4) { animation-delay: 0.15s; }
  .card:nth-child(5) { animation-delay: 0.2s; }
  .card:nth-child(6) { animation-delay: 0.25s; }
</style>
