{{ define "main" }}

<div class="article-header">
  <div class="container--narrow">
    {{ with .Params.categories }}
      <div class="article-category">{{ index . 0 }}</div>
    {{ end }}
    <h1 class="article-title">{{ .Title }}</h1>
    <div class="article-meta">
      <span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "02 janvier 2006" }}</time>
      </span>
      <span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        {{ .ReadingTime }} min de lecture
      </span>
    </div>
  </div>
</div>

<div class="container--narrow">
  <div class="article-body">
    {{ .Content }}
  </div>

  {{ with .Params.tags }}
    <div class="tags">
      {{ range . }}
        <a href="/tags/{{ . | urlize }}/" class="tag"># {{ . }}</a>
      {{ end }}
    </div>
  {{ end }}

  <div style="margin-top: 4rem; padding-top: 2rem; border-top: 1.5px solid var(--line-strong);">
    <a href="/posts/" style="
      font-family: var(--font-mono);
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--gray);
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: color 0.25s ease;
    " onmouseover="this.style.color='var(--navy)'" onmouseout="this.style.color='var(--gray)'">
      ← Retour aux articles
    </a>
  </div>
</div>

{{ end }}
